name: Control Writer Lock

on:
  pull_request:
    paths:
      - '.github/workflows/control-writer-lock.yml'
      - 'internal/mailbox/**'
      - 'internal/mailserver/**'
      - 'cmd/owlmail/**'
      - 'go.mod'
      - 'go.sum'
  push:
    branches: [main]
    paths:
      - '.github/workflows/control-writer-lock.yml'
      - 'internal/mailbox/**'
      - 'internal/mailserver/**'
      - 'cmd/owlmail/**'
      - 'go.mod'
      - 'go.sum'

permissions:
  contents: read

concurrency:
  group: control-writer-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-lock:
    name: Writer lock (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # Linux's full race suite remains in CI; this job executes the native OS
      # locking primitive, including subprocess crash/release on Windows.
      - name: Verify writer lock lifecycle
        run: go test ./internal/mailbox -run '^TestControlWriter' -count=1 -timeout=2m
      - name: Verify offline route operation safety
        run: go test ./internal/mailbox ./cmd/owlmail -run '^(TestOperatorRoute|TestRecipientRouteCLI)' -count=1 -timeout=3m
