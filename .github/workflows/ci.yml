name: CI

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '.github/goreportcard.svg'
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-test:
    name: Web Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: ".bun-version"

      - name: Check browser scripts with Bun
        run: bun build ./web/*.js --target=browser --outdir="${RUNNER_TEMP}/owlmail-browser-check"

      - name: Test browser and documentation with Bun
        run: bun test ./tests/web ./tests/docs

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Test Python integration example helpers
        run: python3 -m unittest examples.testing.python.email_cleanup_test

      - name: Build coverage report
        run: |
          go tool cover -html=coverage.out -o coverage.html
          {
            echo "## Coverage Report"
            echo '```text'
            go tool cover -func=coverage.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          retention-days: 7
          path: |
            coverage.out
            coverage.html

  fuzz:
    name: Fuzz Untrusted Input Parsers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
          # go test -fuzz writes every coverage-increasing input into the build
          # cache. This job deliberately does not persist a corpus, so saving that
          # growth back would inflate a cache nothing reads.
          cache: false

      - name: Download dependencies
        run: go mod download

      # Each target runs for a fixed 30 seconds so the job is a gate rather
      # than a search: it re-runs the committed seed corpus on every pull
      # request and spends a bounded, equal budget looking for new inputs.
      # Minimization is capped well below the fuzzing budget because its
      # default of one minute would otherwise consume the whole run.
      - name: Fuzz MIME, HTML, and Date parsing
        run: |
          for target in FuzzParseEmailMessage FuzzSanitizeHTML FuzzParseEmailDate; do
            go test -run '^$' -fuzz "^${target}$" -fuzztime=30s -fuzzminimizetime=5s ./internal/mailserver
          done

      - name: Fuzz webhook pattern matching
        run: go test -run '^$' -fuzz '^FuzzMatchTextPattern$' -fuzztime=30s -fuzzminimizetime=5s ./internal/webhook

      # Go writes a failing input under the package's testdata directory. It is
      # the reproducer, so it has to leave the runner even though the step that
      # produced it failed.
      - name: Upload failing fuzz inputs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-failures
          retention-days: 7
          path: internal/**/testdata/fuzz/**
          if-no-files-found: ignore

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.13.1
          args: --timeout=5m

  vet:
    name: Vet
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run go vet
        run: go vet ./...

      - name: Run go fmt check
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "Code is not formatted. Please run 'gofmt -s -w .'"
            gofmt -s -d .
            exit 1
          fi

  build-check:
    name: Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build -v -o owlmail ./cmd/owlmail

      - name: Verify binary
        run: |
          if [ -f owlmail ]; then
            echo "Build successful"
            ./owlmail --help || true
          else
            echo "Build failed"
            exit 1
          fi
