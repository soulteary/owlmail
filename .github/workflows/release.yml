name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GO111MODULE: on
  GOFLAGS: -mod=readonly
  GOVULNCHECK_VERSION: "v1.7.0"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve release metadata
        id: release
        shell: bash
        env:
          REQUESTED_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            VERSION="${REQUESTED_VERSION}"
            if [ "${GITHUB_REF}" != "refs/tags/${VERSION}" ]; then
              echo "::error::Manual releases must run at the requested tag ref; use --ref ${VERSION}"
              exit 1
            fi
          else
            VERSION="${GITHUB_REF_NAME}"
          fi

          if [[ ! "${VERSION}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error::Release version must be a semantic-version tag such as v0.6.0"
            exit 1
          fi

          if ! git rev-parse --verify "refs/tags/${VERSION}^{commit}" >/dev/null; then
            echo "::error::Tag ${VERSION} does not exist; create and push it before running a release"
            exit 1
          fi

          git checkout --detach "${VERSION}"
          if [ ! -f VERSION ]; then
            echo "::error::Missing VERSION file at ${VERSION}"
            exit 1
          fi
          DOCUMENTED_VERSION="$(tr -d '\r\n' < VERSION)"
          if [ "${DOCUMENTED_VERSION}" != "${VERSION#v}" ]; then
            echo "::error::VERSION contains ${DOCUMENTED_VERSION}, expected ${VERSION#v}"
            exit 1
          fi
          NOTES="docs/en/Release-${VERSION#v}.md"
          if [ ! -f "${NOTES}" ]; then
            echo "::error::Missing curated release notes: ${NOTES}"
            exit 1
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "app-version=${VERSION#v}" >> "${GITHUB_OUTPUT}"
          echo "commit=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
          echo "notes=${NOTES}" >> "${GITHUB_OUTPUT}"

          if [[ "${VERSION}" == *-* ]]; then
            echo "prerelease=true" >> "${GITHUB_OUTPUT}"
          else
            echo "prerelease=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Refuse to overwrite exact release image tag
        shell: bash
        env:
          APP_VERSION: ${{ steps.release.outputs.app-version }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE_REF="${REGISTRY}/${IMAGE_NAME}:${APP_VERSION}"
          if ! REGISTRY_TOKEN="$(curl --fail --silent --show-error \
            --user "${GITHUB_ACTOR}:${GHCR_TOKEN}" \
            --get \
            --data-urlencode "service=${REGISTRY}" \
            --data-urlencode "scope=repository:${IMAGE_NAME}:pull" \
            "https://${REGISTRY}/token" | jq -er '.token // .access_token')"; then
            echo "::error::Could not exchange the GitHub credential for a GHCR registry token"
            exit 1
          fi
          if ! HTTP_STATUS="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer ${REGISTRY_TOKEN}" \
            --header 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
            "https://${REGISTRY}/v2/${IMAGE_NAME}/manifests/${APP_VERSION}")"; then
            echo "::error::Could not verify whether ${IMAGE_REF} already exists"
            exit 1
          fi
          case "${HTTP_STATUS}" in
            404)
              ;;
            200)
              echo "::error::Refusing to overwrite published release image ${IMAGE_REF}; create a new patch release"
              exit 1
              ;;
            *)
              echo "::error::Registry returned HTTP ${HTTP_STATUS} while checking ${IMAGE_REF}; failing closed"
              exit 1
              ;;
          esac

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: ".bun-version"

      - name: Download dependencies
        run: go mod download

      - name: Run release preflight checks
        shell: bash
        run: |
          go mod verify
          UNFORMATTED="$(gofmt -s -l .)"
          if [ -n "${UNFORMATTED}" ]; then
            echo "${UNFORMATTED}"
            echo "::error::Go source files are not formatted"
            exit 1
          fi
          go vet ./...
          go test -race ./...

      - name: Scan for reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION} ./...

      - name: Verify browser assets and documentation
        run: |
          bun build ./web/*.js --target=browser --outdir="${RUNNER_TEMP}/owlmail-browser-check"
          bun test ./tests/web ./tests/docs

      - name: Build binaries
        env:
          CGO_ENABLED: 0
        run: |
          VERSION="${{ steps.release.outputs.version }}"
          APP_VERSION="${VERSION#v}"
          COMMIT="$(git rev-parse HEAD)"
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          LDFLAGS="-s -w \
            -X github.com/soulteary/version-kit/v2.Version=${APP_VERSION} \
            -X github.com/soulteary/version-kit/v2.Commit=${COMMIT} \
            -X github.com/soulteary/version-kit/v2.BuildDate=${BUILD_DATE} \
            -X github.com/soulteary/version-kit/v2.Branch=${VERSION}"
          
          echo "Building version: ${APP_VERSION} (${COMMIT})"
          
          # Linux (static linking for better compatibility)
          GOOS=linux GOARCH=amd64 go build -a -installsuffix cgo -ldflags "${LDFLAGS} -extldflags=-static" -o owlmail-linux-amd64 ./cmd/owlmail
          GOOS=linux GOARCH=arm64 go build -a -installsuffix cgo -ldflags "${LDFLAGS} -extldflags=-static" -o owlmail-linux-arm64 ./cmd/owlmail
          
          # macOS
          GOOS=darwin GOARCH=amd64 go build -a -installsuffix cgo -ldflags "${LDFLAGS}" -o owlmail-darwin-amd64 ./cmd/owlmail
          GOOS=darwin GOARCH=arm64 go build -a -installsuffix cgo -ldflags "${LDFLAGS}" -o owlmail-darwin-arm64 ./cmd/owlmail
          
          # Windows
          GOOS=windows GOARCH=amd64 go build -a -installsuffix cgo -ldflags "${LDFLAGS}" -o owlmail-windows-amd64.exe ./cmd/owlmail

      - name: Verify embedded release metadata
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          EXPECTED_VERSION="${RELEASE_VERSION#v}"
          EXPECTED_COMMIT="$(git rev-parse HEAD)"
          LOG_FILE="${RUNNER_TEMP}/owlmail-release-smoke.log"
          DATA_DIR="${RUNNER_TEMP}/owlmail-release-smoke-data"

          ./owlmail-linux-amd64 \
            -ip 127.0.0.1 -smtp 11025 \
            -web-ip 127.0.0.1 -web 11080 \
            -mail-directory "${DATA_DIR}" >"${LOG_FILE}" 2>&1 &
          SERVER_PID=$!
          cleanup() {
            kill "${SERVER_PID}" 2>/dev/null || true
            wait "${SERVER_PID}" 2>/dev/null || true
          }
          trap cleanup EXIT

          READY=false
          for _ in {1..30}; do
            if curl --silent --show-error --fail http://127.0.0.1:11080/healthz >/dev/null; then
              READY=true
              break
            fi
            sleep 1
          done
          if [ "${READY}" != "true" ]; then
            cat "${LOG_FILE}"
            echo "::error::Release binary did not become ready"
            exit 1
          fi

          VERSION_JSON="$(curl --silent --show-error --fail http://127.0.0.1:11080/api/v1/version)"
          if ! grep -Fq "\"version\":\"${EXPECTED_VERSION}\"" <<<"${VERSION_JSON}"; then
            echo "::error::Expected embedded version ${EXPECTED_VERSION}, got ${VERSION_JSON}"
            exit 1
          fi
          if ! grep -Fq "\"commit\":\"${EXPECTED_COMMIT}\"" <<<"${VERSION_JSON}"; then
            echo "::error::Expected embedded commit ${EXPECTED_COMMIT}, got ${VERSION_JSON}"
            exit 1
          fi

      - name: Generate Linux amd64 SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          file: owlmail-linux-amd64
          format: spdx-json
          output-file: owlmail-linux-amd64.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate Linux arm64 SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          file: owlmail-linux-arm64
          format: spdx-json
          output-file: owlmail-linux-arm64.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate macOS amd64 SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          file: owlmail-darwin-amd64
          format: spdx-json
          output-file: owlmail-darwin-amd64.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate macOS arm64 SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          file: owlmail-darwin-arm64
          format: spdx-json
          output-file: owlmail-darwin-arm64.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate Windows amd64 SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          file: owlmail-windows-amd64.exe
          format: spdx-json
          output-file: owlmail-windows-amd64.exe.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Create checksums
        run: |
          sha256sum owlmail-* > checksums.txt

      - name: Attest release binaries
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: checksums.txt

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign checksum manifest with Sigstore
        run: cosign sign-blob --yes --bundle checksums.txt.sigstore.json checksums.txt

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image build metadata
        id: build-meta
        shell: bash
        run: echo "build-date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "${GITHUB_OUTPUT}"

      - name: Revalidate moving image tags
        id: moving-tags
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          git fetch --force --tags origin
          LATEST_STABLE=""
          while IFS= read -r TAG; do
            if [[ "${TAG}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              LATEST_STABLE="${TAG}"
              break
            fi
          done < <(git tag --list 'v*' --sort=-version:refname)

          ENABLED=false
          if [[ "${VERSION}" != *-* ]] && [ "${VERSION}" = "${LATEST_STABLE}" ]; then
            ENABLED=true
          fi
          echo "enabled=${ENABLED}" >> "${GITHUB_OUTPUT}"

      - name: Extract release image metadata
        id: image-meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # SemVer tags enable latest=auto by default. Keep latest explicit so
          # retries of older stable releases cannot move it backwards.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ steps.release.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.release.outputs.version }},enable=${{ steps.moving-tags.outputs.enabled == 'true' }}
            type=semver,pattern={{major}},value=${{ steps.release.outputs.version }},enable=${{ steps.moving-tags.outputs.enabled == 'true' }}
            type=raw,value=latest,enable=${{ steps.moving-tags.outputs.enabled == 'true' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.release.outputs.commit }}
            org.opencontainers.image.version=${{ steps.release.outputs.app-version }}
            org.opencontainers.image.licenses=MIT

      - name: Build and push release image
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            VERSION=${{ steps.release.outputs.app-version }}
            COMMIT=${{ steps.release.outputs.commit }}
            BUILD_DATE=${{ steps.build-meta.outputs.build-date }}
            BRANCH=${{ steps.release.outputs.version }}
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.image-meta.outputs.tags }}
          labels: ${{ steps.image-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest release image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Sign release image with Sigstore
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: cosign sign --yes "${REGISTRY}/${IMAGE_NAME}@${IMAGE_DIGEST}"

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: ${{ steps.release.outputs.version }}
          tag_name: ${{ steps.release.outputs.version }}
          body_path: ${{ steps.release.outputs.notes }}
          files: |
            owlmail-*
            checksums.txt
            checksums.txt.sigstore.json
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.release.outputs.prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
