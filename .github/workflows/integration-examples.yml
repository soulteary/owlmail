name: Integration Examples

on:
  push:
    branches: [ main, develop ]
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'examples/testing/**'
      - '.github/workflows/integration-examples.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'examples/testing/**'
      - '.github/workflows/integration-examples.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-examples-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  examples:
    name: Go, Python, and JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build OwlMail
        run: go build -o "${RUNNER_TEMP}/owlmail" ./cmd/owlmail

      - name: Run every integration example
        shell: bash
        run: |
          set -euo pipefail
          log_file="${RUNNER_TEMP}/owlmail-integration.log"
          mail_dir="${RUNNER_TEMP}/owlmail-example-mail"
          mkdir -p "$mail_dir"
          owlmail_pid=""
          cleanup() {
            status=$?
            if [ -n "$owlmail_pid" ]; then
              kill "$owlmail_pid" 2>/dev/null || true
              wait "$owlmail_pid" 2>/dev/null || true
            fi
            if [ "$status" -ne 0 ]; then
              cat "$log_file"
            fi
            exit "$status"
          }
          trap cleanup EXIT

          "${RUNNER_TEMP}/owlmail" \
            -smtp 1025 \
            -web 1080 \
            -web-ip 127.0.0.1 \
            -mail-directory "$mail_dir" >"$log_file" 2>&1 &
          owlmail_pid=$!

          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --connect-timeout 2 --max-time 3 \
              http://127.0.0.1:1080/readyz >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            echo "OwlMail did not become ready" >&2
            exit 1
          fi

          node --version
          node examples/testing/javascript/email-test.mjs
          python3 --version
          python3 examples/testing/python/email_test.py
          OWLMAIL_RUN_INTEGRATION_TEST=1 go test -count=1 ./examples/testing/go -v

      - name: Upload OwlMail log on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-example-log
          retention-days: 7
          path: ${{ runner.temp }}/owlmail-integration.log
          if-no-files-found: error

  gorge-smtp:
    name: Pinned Gorge SMTP adapter
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout OwlMail
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: owlmail

      - name: Checkout unchanged Gorge source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: soulteary/gorge
          ref: e9ca3b7af2cc8914207fc22ffb499f5069d3364c
          path: gorge
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: owlmail/go.mod
          cache-dependency-path: |
            owlmail/go.sum
            gorge/go/go.sum

      - name: Build pinned external adapter
        timeout-minutes: 5
        run: |
          test "$(git -C gorge rev-parse HEAD)" = e9ca3b7af2cc8914207fc22ffb499f5069d3364c
          test -z "$(git -C gorge status --porcelain)"
          go -C gorge/go build -mod=readonly -o "${RUNNER_TEMP}/gorge-mailer" ./cmd/gorge-mailer

      - name: Exercise real Gorge implicit-TLS SMTP delivery
        working-directory: owlmail
        env:
          OWLMAIL_GORGE_BINARY: ${{ runner.temp }}/gorge-mailer
        run: go test -race -tags gorge_integration ./tests/gorge -run '^TestPinnedGorgeSMTP$' -count=1 -timeout=120s -v
