name: Verify published OwlMail v0.11.4 image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: verify-published-owlmail-0.11.4-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Published image ${{ matrix.arch }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_INDEX_DIGEST: sha256:739d1b873bb2bcf8e1131fa6357016eb254006fa2ab5049115ab8d0d3e3878f1
      EXPECTED_ARCH: ${{ matrix.arch }}
    steps:
      - name: Checkout isolated verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: verifier
      - name: Checkout exact released smoke tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 42de31580c48850c940dfe589ea23b6010dba321
          persist-credentials: false
          path: source
      - name: Verify public parent and child, then exercise released image
        working-directory: source
        run: python3 ../verifier/.github/scripts/verify-published-image.py
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: owlmail-v0.11.4-public-image-${{ matrix.arch }}
          path: source/verification-evidence/
          if-no-files-found: error
          retention-days: 14
