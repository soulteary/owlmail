name: Build

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/goreportcard.svg'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/goreportcard.svg'
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO111MODULE: on

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify dependencies
        run: |
          go mod download
          go mod verify

      - name: Build pull request platform
        if: github.event_name == 'pull_request'
        env:
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          go build -v -o dist/owlmail ./cmd/owlmail

      - name: Cross-compile main branch
        if: github.event_name != 'pull_request'
        env:
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -o dist/owlmail-linux-amd64 ./cmd/owlmail
          GOOS=linux GOARCH=arm64 go build -o dist/owlmail-linux-arm64 ./cmd/owlmail
          GOOS=darwin GOARCH=amd64 go build -o dist/owlmail-darwin-amd64 ./cmd/owlmail
          GOOS=darwin GOARCH=arm64 go build -o dist/owlmail-darwin-arm64 ./cmd/owlmail
          GOOS=windows GOARCH=amd64 go build -o dist/owlmail-windows-amd64.exe ./cmd/owlmail

      - name: Verify clean binary VCS metadata
        run: python3 scripts/verify-binary-vcs.py dist/owlmail*

      - name: Bundle snapshot licenses and upstream notices
        if: github.event_name != 'pull_request'
        run: go run ./scripts/license-bundle -output dist/licenses

      - name: Upload main branch snapshots
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: owlmail-${{ github.sha }}
          path: dist/
          retention-days: 7
