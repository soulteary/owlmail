name: 🐛 Bug 报告
description: 报告一个 bug 以帮助我们改进
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢您报告 bug！请填写以下信息以帮助我们更好地理解和修复问题。
        请勿提交密码、SMTP AUTH、S3 Key、Webhook Secret、访问 Token 或完整敏感邮件内容；提交前请对日志和配置脱敏。

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 清晰简洁地描述这个 bug
      placeholder: 描述您遇到的问题...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 描述如何复现这个问题
      placeholder: |
        1. 执行 '...'
        2. 点击 '...'
        3. 滚动到 '...'
        4. 看到错误
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      description: 描述您期望发生什么
      placeholder: 应该发生什么...
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 描述实际发生了什么
      placeholder: 实际发生了什么...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志输出
      description: 如果有相关日志，请粘贴在这里
      placeholder: 粘贴日志输出...
      render: shell

  - type: textarea
    id: environment
    attributes:
      label: 环境信息
      description: 请提供您的环境信息
      placeholder: |
        - 操作系统: [例如 macOS 14.0, Linux Ubuntu 22.04, Windows 11]
        - Go 版本（仅源码构建）: [例如 go1.27.0]
        - OwlMail 版本: [例如 v0.9.0 或 commit hash]
        - 容器镜像或二进制校验和（如有）:
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: 部署方式
      description: OwlMail 如何运行？
      options:
        - Docker 或兼容容器运行时
        - 下载的发布二进制
        - go install
        - 从源码构建
        - 其他
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: 受影响组件
      description: 选择最接近的系统边界。
      options:
        - SMTP 捕获、STARTTLS 或 SMTPS
        - Web UI、HTML 预览或 BasePath
        - 原生 REST API 或 WebSocket
        - MailDev 或 MailCatcher 兼容层
        - MCP HTTP 或 stdio
        - 邮件存储、SQLite、附件或 S3
        - Webhook 自动化
        - 出站 Relay
        - Metrics、Readiness 或日志
        - Sendmail CLI
        - 配置或启动
        - 其他
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: 配置信息
      description: 相关配置，包括 BasePath、TLS、本地/S3 存储、MCP、REST 或 Webhook 设置；必须移除所有 Secret
      placeholder: |
        命令行参数或环境变量配置...
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: 附加信息
      description: 任何其他有助于理解问题的信息
      placeholder: 截图、错误堆栈、相关链接等...

  - type: checkboxes
    id: checks
    attributes:
      label: 检查清单
      options:
        - label: 我已经搜索了现有的 Issues，确认这是一个新问题
          required: true
        - label: 我已经检查了文档，没有找到相关说明
          required: false
        - label: 我可以提供复现步骤
          required: true
