name: 🐛 Bug Report
description: File a bug report to help us improve
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill in the information below to help us better understand and fix the issue.
        Do not include passwords, SMTP AUTH values, S3 keys, Webhook secrets, access tokens, or complete sensitive email content. Redact logs and configuration before submitting.

  - type: textarea
    id: description
    attributes:
      label: Problem Description
      description: A clear and concise description of the bug
      placeholder: Describe the issue you encountered...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Describe how to reproduce this issue
      placeholder: |
        1. Execute '...'
        2. Click '...'
        3. Scroll to '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: Describe what you expected to happen
      placeholder: What should happen...
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: Describe what actually happened
      placeholder: What actually happened...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Log Output
      description: If there are relevant logs, please paste them here
      placeholder: Paste log output...
      render: shell

  - type: textarea
    id: environment
    attributes:
      label: Environment Information
      description: Please provide your environment information
      placeholder: |
        - OS: [e.g., macOS 14.0, Linux Ubuntu 22.04, Windows 11]
        - Go Version (source builds only): [e.g., go1.27.0]
        - OwlMail Version: [e.g., v0.9.0 or commit hash]
        - Container image or binary checksum (if available):
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: Deployment Mode
      description: How is OwlMail running?
      options:
        - Docker or compatible container runtime
        - Downloaded release binary
        - go install
        - Built from source
        - Other
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      description: Select the closest system boundary.
      options:
        - SMTP capture, STARTTLS, or SMTPS
        - Web UI, HTML preview, or BasePath
        - Native REST API or WebSocket
        - MailDev or MailCatcher compatibility
        - MCP over HTTP or stdio
        - Mail storage, SQLite, attachments, or S3
        - Webhook automation
        - Outgoing Relay
        - Metrics, readiness, or logging
        - Sendmail CLI
        - Configuration or startup
        - Other
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Configuration Information
      description: Relevant configuration, including BasePath, TLS, local/S3 storage, MCP, REST, or Webhook settings. Remove every secret.
      placeholder: |
        Command line arguments or environment variables...
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: Additional Information
      description: Any other information that helps understand the issue
      placeholder: Screenshots, error stack traces, related links, etc...

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I have searched existing Issues and confirmed this is a new issue
          required: true
        - label: I have checked the documentation and found no relevant information
          required: false
        - label: I can provide steps to reproduce
          required: true
