x-owlmail-disabled-capabilities:
    - mcp
    - websocket
    - relay-send
    - webhook-send
    - s3
    - legacy-compatibility
    - global-settings-write
    - global-reload
x-owlmail-identity:
    conflict: An already-bound address is never automatically transferred to another subject; the new subject only retains its own mailbox.
    emailHeader: X-Auth-Email
    emailVerifiedHeader: X-Auth-Email-Verified
    namespace: Deployment-fixed; cannot be selected by the client
    subjectHeader: X-Auth-User
    verifiedValue: "true"
x-owlmail-mode: multiuser
x-owlmail-public-startup-gated: true
x-owlmail-smtp-quotas:
    attempts: AUTH and authenticated RCPT attempts use durable fixed-minute budgets and a nondecreasing clock watermark. Restart/clock rollback cannot reset them; unknown AUTH names share one global key.
    configuration: Positive limits are deployment-configurable. These documented defaults are not a per-request remaining-budget API.
    defaults:
        authAttemptsGlobalMinute: 120
        diskMiBGlobal: 10240
        diskMiBPerMailbox: 1024
        messagesGlobal: 100000
        messagesPerMailbox: 10000
        pendingMailboxes: 1000
        rcptAttemptsPerAccountMinute: 60
    transport: SMTP quotas are not HTTP 429 responses. Exhausted capacity or RCPT attempt quota refuses submission temporarily with 451; auth attempt exhaustion rejects AUTH. Multi-recipient DATA is accepted or refused as one group, never partly charged.
    usage: Per-mailbox and global hard limits count committed messages and logical EML + metadata + decoded-attachment bytes. Deletion releases capacity; recovery derives the same usage. Global limits refuse new mail rather than evict another user's mail. Merge over quota is deferred without denying personal inbox access.
