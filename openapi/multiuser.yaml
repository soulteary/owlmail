        post:
            description: 'Long-poll only this mailbox after its opaque cursor. count means at least count retained matching deliveries. A 200 result can time out: check timed_out, not only HTTP status. Cursors from another mailbox or an earlier process fail with 400. Capacity is 8 waiters per mailbox and 64 globally; 429 has no Retry-After guarantee.'
