            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                after:
                                    type: string
                                count:
                                    default: 1
                                    description: 0 selects the default 1; effective range 1..100.
                                    maximum: 100
                                    minimum: 0
                                    type: integer
                                recipient:
                                    maxLength: 1024
                                    type: string
                                run_id:
                                    maxLength: 128
                                    type: string
                                subject:
                                    maxLength: 1024
                                    type: string
                                text:
                                    maxLength: 1024
                                    type: string
                                timeout_seconds:
                                    default: 30
                                    description: 0 selects the default 30 seconds; effective range 1..120.
                                    maximum: 120
                                    minimum: 0
                                    type: integer
                            required:
                                - after
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    cursor:
                                        type: string
                                    emails:
                                        items:
                                            $ref: '#/components/schemas/Email'
                                        maxItems: 100
                                        type: array
                                    timed_out:
                                        type: boolean
                                    waited_milliseconds:
                                        type: integer
                                required:
                                    - emails
                                    - cursor
                                    - timed_out
                                    - waited_milliseconds
                                type: object
                    description: Successful result
                    headers:
                        Cache-Control:
                            description: Sensitive responses are private and must not be stored.
                            schema:
                                const: private, no-store
                                type: string
                        X-OwlMail-Identity:
                            description: Opaque stable assertion marker, only after trusted identity verification; clients clear old mailbox state when it changes. It is not an authentication credential.
                            schema:
                                pattern: ^[a-f0-9]{64}$
